services:
  psf-guard:
    image: ghcr.io/theatrus/psf-guard:latest
    container_name: psf-guard
    working_dir: /data
    volumes:
      - /share/Container/psf-guard/data/nas-repo.sqlite:/data/nas-repo.sqlite
      #- /share/Container/psf-guard/data/nina-sync.sqlite:/data/nina-sync.sqlite
      - /share/Astrophotography/Repository:/images:ro
      - /share/Astrophotography/InProgress:/images-live
      - /share/Container/psf-guard/auth:/home/psfguard/.config/psf-guard
      - /share/Container/psf-guard/catalogs:/catalogs
      - /share/Container/psf-guard/cache:/data/cache
      - /share/Container/psf-guard/config.toml:/data/config.toml:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
      - RUST_LOG=info
      - SEIZA_CATALOG_DIR=/catalogs
    ports:
      - 3000:3000
    command: server --config /data/config.toml /data/nas-repo.sqlite /images --allow-database-management
    #command: server /data/nas-repo.sqlite /images --allow-database-management
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://192.168.3.2:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
