services:
  psf-guard:
    image: ghcr.io/theatrus/psf-guard:latest
    container_name: psf-guard
    working_dir: /data
    volumes:
      - /share/Container/psf-guard/data/nas-repo.sqlite:/data/nas-repo.sqlite
      - /share/Astrophotography/Repository:/images:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
      - RUST_LOG=info
    ports:
      - 3000:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/projects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
