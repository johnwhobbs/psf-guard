services:
  psf-guard:
    image: ghcr.io/theatrus/psf-guard:latest
    container_name: psf-guard
    volumes:
      - /share/Container/psf-guard/data:/data/database.sqlite
      - /share/Astrophotography/Repository:/images:ro
    ports:
      - "3000:3000"
    command: server /data/database.sqlite /images
    restart: unless-stopped
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/projects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
